<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Manager</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --text:#1f2937; --muted:#6b7280; --green:#16a34a; --red:#dc2626; --blue:#2563eb; --border:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { background:#111827; color:#fff; padding:12px 24px; display:flex; justify-content:space-between; align-items:center; }
  header nav { display:flex; gap:14px; align-items:center; }
  header .nav-link { font-size:14px; font-weight:500; }
  header .who { color:#9ca3af; font-size:14px; }
  header button { padding:6px 12px; }
  .auth { max-width:420px; margin:40px auto; }
  .auth a { color:var(--blue); }
  header a { color:#fff; text-decoration:none; font-weight:600; font-size:20px; }
  main { max-width:1000px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:16px; margin-bottom:20px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .stat .label { color:var(--muted); font-size:13px; }
  .stat .value { font-size:24px; font-weight:700; margin-top:4px; }
  .big { background:#111827; color:#fff; }
  .big .label { color:#9ca3af; }
  .green { color:var(--green); } .red { color:var(--red); } .blue { color:var(--blue); }
  form.inline { display:grid; grid-template-columns: 1fr 1fr 1fr 2fr auto; gap:10px; align-items:end; }
  @media (max-width:700px){ form.inline { grid-template-columns:1fr; } }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:4px; }
  input, select { width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px; }
  button, .btn { background:var(--blue); color:#fff; border:0; padding:10px 16px; border-radius:8px; cursor:pointer; font-size:14px; text-decoration:none; display:inline-block; }
  .btn-light { background:#e5e7eb; color:var(--text); }
  .btn-danger { background:var(--red); }
  .link { background:none; color:var(--blue); padding:0; font-size:13px; }
  .link.red { color:var(--red); }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; font-size:14px; }
  th { color:var(--muted); font-weight:500; }
  .right { text-align:right; }
  .day-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .day-head h3 { margin:0; font-size:16px; }
  .pill { font-size:12px; padding:2px 8px; border-radius:999px; font-weight:600; }
  .pill.BALANCE { background:#dbeafe; color:var(--blue); }
  .pill.INCOME { background:#dcfce7; color:var(--green); }
  .pill.EXPENSE { background:#fee2e2; color:var(--red); }
  .msg { padding:10px 14px; border-radius:8px; background:#dcfce7; color:#166534; margin-bottom:16px; }
  .errorlist { color:var(--red); font-size:12px; margin:4px 0 0; padding-left:16px; }
  .muted { color:var(--muted); }
  .toolbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:12px; }
  .toolbar form { display:flex; gap:8px; align-items:center; }
</style>
</head>
<body>
<header>
  <a href="{% url 'dashboard' %}">💰 Expense Manager</a>
  <nav>
    {% if user.is_authenticated %}
      <span class="who">{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}" style="display:inline">
        {% csrf_token %}<button type="submit" class="btn-light">Log out</button>
      </form>
    {% else %}
      <a class="nav-link" href="{% url 'login' %}">Log in</a>
      <a class="nav-link" href="{% url 'register' %}">Register</a>
    {% endif %}
  </nav>
</header>
<main>
  {% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
