{% extends "tracker/base.html" %}
{% block title %}Edit entry{% endblock %}
{% block content %}
<div style="max-width:480px;margin:0 auto">
  <div class="page-head">
    <div>
      <div class="breadcrumb"><a href="{% url 'book_list' %}">My books</a> / <a href="{% url 'book_detail' book.pk %}?month={{ t.date|date:'Y-m' }}">{{ book.name }}</a> / Edit</div>
      <h1>Edit entry</h1>
    </div>
  </div>
  <div class="card">
    <form method="post">
      {% include "tracker/_entry_form.html" %}
      <button class="btn" type="submit">Save changes</button>
      <a class="btn btn-ghost" href="{% url 'book_detail' book.pk %}?month={{ t.date|date:'Y-m' }}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
