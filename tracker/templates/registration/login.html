{% extends "tracker/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth">
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub muted">Log in to see your books.</p>
    <form method="post">
      {% include "registration/_form.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-block">Log in</button>
    </form>
  </div>
  <p class="foot muted">New here? <a href="{% url 'register' %}">Create an account</a></p>
</div>
{% endblock %}
