{% extends "tracker/base.html" %}
{% block content %}

  <form method="post">
    {% include "registration/_form.html" %}

  </form>
  <p class="muted">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
